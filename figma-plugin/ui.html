<p>Copy this webhook URL and paste it into your n8n Figma node:</p>
<input type="text" id="webhook-url" readonly>
<button id="copy-url">Copy</button>

<script>
  const webhookUrlInput = document.getElementById('webhook-url');
  const copyUrlButton = document.getElementById('copy-url');

  window.onmessage = (event) => {
    const message = event.data.pluginMessage;
    if (message.type === 'webhookUrl') {
      webhookUrlInput.value = message.url;
    }
  };

  copyUrlButton.onclick = () => {
    webhookUrlInput.select();
    document.execCommand('copy');
  };
</script>
